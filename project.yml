name: Oculab

options:
  bundleIdPrefix: com.Oculab

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: 74
  DEVELOPMENT_TEAM: XSHZNN2ULY

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.9.1
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.1
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1

targets:
  Oculab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Oculab
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "ci_scripts"
          - "project.yml"
          - ".git"
          - ".DS_Store"
    info:
      path: Oculab/Info.plist
      properties:
        CFBundleDisplayName: Oculab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.medical
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIImageName: ""
        UIAppFonts:
          - Inter-Bold.ttf
          - Inter-Regular.ttf
          - Inter-SemiBold.ttf
        NSCameraUsageDescription: We would like to access your camera to record video
        NSMicrophoneUsageDescription: We would like to access your microphone to record video
        NSPhotoLibraryUsageDescription: We need access to save videos to your photo library.
        NSFaceIDUsageDescription: We use Face ID to secure and unlock the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.Oculab.Oculab.deeplink
            CFBundleURLSchemes:
              - oculab
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Oculab.Oculab
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: XSHZNN2ULY
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: Alamofire
      - package: Lottie
      - package: SocketIO
    # postCompileScripts:
    #   - script: |
    #       export PATH="$PATH:/opt/homebrew/bin"
    #       if which swiftformat >/dev/null; then
    #         git diff --cached --name-only --diff-filter=ACMR | grep ".swift$" | xargs swiftformat
    #       else
    #         echo "warning: Swiftformat not installed"
    #       fi
    #     name: SwiftFormat
    #     showEnvVars: true
    #     basedOnDependencyAnalysis: true
    #     runOnlyWhenInstalling: true

  OculabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OculabTests
    dependencies:
      - target: Oculab
    info:
      path: OculabTests/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Oculab.OculabTests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: XSHZNN2ULY
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES

schemes:
  Oculab:
    build:
      targets:
        Oculab: all
        OculabTests: [test]
    test:
      targets:
        - OculabTests
      gatherCoverageData: true
